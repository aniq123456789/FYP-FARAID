<!doctype html>
<html lang="ms">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <title>Sistem Pembahagian Lot Tanah Faraid - PUO</title>
        
        <!-- CSS Resources -->
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

        <style>
            body, html { height: 100%; margin: 0; font-family: 'Poppins', sans-serif; overflow: hidden; background-color: #f4f6f9; }
            
            /* --- HEADER STYLING --- */
            header {
                height: 75px; width: 100%; background: #14532d;
                display: flex; align-items: center; justify-content: center; color: white;
                border-bottom: 4px solid #16a34a; z-index: 1000; position: relative;
                box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            }
            .header-content { display: flex; align-items: center; width: 96%; justify-content: space-between; }
            .logo-poli, .logo-puo { height: 50px; width: auto; }

            /* --- MAIN LAYOUT STYLING --- */
            #wrapper { display: flex; width: 100%; height: calc(100vh - 75px); }
            
            #sidebar { 
                min-width: 380px; width: 380px; background: #ffffff; 
                display: flex; flex-direction: column; box-shadow: 4px 0 15px rgba(0,0,0,0.08); 
                z-index: 1050; transition: 0.3s; overflow-y: auto; padding-bottom: 20px;
            }
            #sidebar.active { margin-left: -380px; }
            
            #map-container { flex-grow: 1; position: relative; background: #eee; overflow: hidden; }
            #map { width: 100%; height: 100%; cursor: crosshair; }
            
            #sidebarCollapse { 
                position: absolute; top: 15px; left: 15px; z-index: 1000; 
                background: #14532d; color: white; border: none; padding: 10px 14px; 
                cursor: pointer; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            }
            
            .card-menu { background: #fff; border-radius: 10px; padding: 16px; margin: 12px; border: 1px solid #e2e8f0; }
            .card-menu h6 { font-weight: 700; color: #14532d; margin-bottom: 12px; border-bottom: 2px solid #16a34a; padding-bottom: 6px; }
            
            .info-box { background: #f8fafc; padding: 8px 12px; border-radius: 6px; border-left: 4px solid #16a34a; margin-bottom: 8px; }
            .info-label { font-size: 10px; text-transform: uppercase; color: #64748b; font-weight: 700; display: block; }
            .info-value { font-size: 14px; color: #0f172a; font-weight: 700; display: block; }
            
            /* --- FARAID CALCULATOR STYLING --- */
            .btn-faraid { background: #14532d; color: white; width: 100%; padding: 10px; border-radius: 6px; font-weight: 700; border: none; transition: 0.2s; }
            .btn-faraid:hover { background: #15803d; }
            
            .radio-group label { font-size: 13px; font-weight: 500; margin-right: 15px; cursor: pointer; }
            
            #resultFaraid { 
                margin-top: 15px; padding: 12px; background: #f0fdf4; 
                border-radius: 8px; display: none; border: 1px solid #bbf7d0; 
            }
            
            .faraid-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11px; }
            .faraid-table th { background: #14532d; color: white; padding: 6px; text-align: center; }
            .faraid-table td { padding: 6px; border: 1px solid #cbd5e1; text-align: center; }
            .faraid-table tr:nth-child(even) { background: #ffffff; }
            
            #lotCanvas { width: 100%; border: 1px solid #94a3b8; margin-top: 10px; background: white; border-radius: 6px; }

            /* --- MAP MAPPER & TOOLTIP STYLING --- */
            .leaflet-tooltip-own {
                background: rgba(15, 23, 42, 0.9); border: 1px solid #16a34a;
                border-radius: 4px; color: white; padding: 6px 10px;
                font-family: 'Poppins', sans-serif; box-shadow: 0 3px 8px rgba(0,0,0,0.2);
            }
            .polygon-label {
                background: none !important; border: none !important; box-shadow: none !important;
                color: #ffffff; font-weight: 800; text-shadow: 2px 2px 3px #000;
                text-align: center; white-space: nowrap; font-size: 11px;
            }
        </style>
    </head>
    <body>

        <header>
            <div class="header-content">
                <img src="Poli_Logo.png" class="logo-poli" alt="Logo Politeknik" onerror="this.style.display='none'">
                <div class="text-center">
                    <h2 class="m-0 fw-bold fs-5">Sistem Maklumat Lot Tanah & Pembahagian Faraid</h2>
                    <p class="m-0 text-light style-sub" style="font-size: 11px;">Jabatan Geomatik - Politeknik Ungku Omar</p>
                </div>
                <img src="image_247e7c.png" class="logo-puo" alt="Logo PUO" onerror="this.style.display='none'">
            </div>
        </header>

        <div id="wrapper">
            <nav id="sidebar">
                <!-- CARIAN LOT -->
                <div class="card-menu">
                    <h6><i class="fas fa-search me-2"></i>Carian Lot Tanah</h6>
                    <select id="lotSearchSelector" class="form-select form-select-sm">
                        <option value="">-- Pilih Nombor Lot --</option>
                    </select>
                </div>

                <!-- BUTIRAN LOT -->
                <div class="card-menu">
                    <h6><i class="fas fa-map-marker-alt me-2"></i>Maklumat Lot Dipilih</h6>
                    <div id="lotDataDisplay">
                        <div class="row g-2">
                            <div class="col-6">
                                <div class="info-box">
                                    <span class="info-label">No. Lot</span>
                                    <span id="res-no-lot" class="info-value">-</span>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="info-box">
                                    <span class="info-label">Luas Lot</span>
                                    <span id="res-luas" class="info-value">-</span>
                                </div>
                            </div>
                        </div>
                        <div class="info-box mt-1">
                            <span class="info-label">Pemilik Berdaftar</span>
                            <span id="res-owner" class="info-value">-</span>
                        </div>
                    </div>
                </div>

                <!-- KALKULATOR FARAID TANAH -->
                <div class="card-menu">
                    <h6><i class="fas fa-calculator me-2"></i>Kalkulator Faraid Lot Tanah</h6>
                    
                    <div class="mb-2">
                        <label class="form-label text-dark fw-bold mb-1" style="font-size: 11px;">1. Luas Lot Tanah (m²)</label>
                        <input type="number" id="luasTanah" class="form-control form-control-sm" placeholder="Sila pilih lot di peta" min="0" readonly>
                    </div>

                    <div class="mb-2">
                        <label class="form-label text-dark fw-bold mb-1" style="font-size: 11px;">2. Status Isteri Gemulah (Si Mati)</label>
                        <div class="radio-group">
                            <label><input type="radio" name="isteri" value="ya"> Ada (1 Isteri)</label>
                            <label><input type="radio" name="isteri" value="tidak" checked> Tiada / Meninggal</label>
                        </div>
                    </div>

                    <div class="row g-2 mb-2">
                        <div class="col-6">
                            <label class="form-label text-dark fw-bold mb-1" style="font-size: 11px;">3. Anak Lelaki</label>
                            <input type="number" id="anakLelaki" class="form-control form-control-sm" min="0" value="1">
                        </div>
                        <div class="col-6">
                            <label class="form-label text-dark fw-bold mb-1" style="font-size: 11px;">4. Anak Perempuan</label>
                            <input type="number" id="anakPerempuan" class="form-control form-control-sm" min="0" value="1">
                        </div>
                    </div>

                    <button class="btn-faraid mt-2" onclick="kiraFaraid()">
                        <i class="fas fa-balance-scale me-1"></i> KIRA PEMBAHAGIAN FARAID
                    </button>

                    <!-- KEPUTUSAN FARAID -->
                    <div id="resultFaraid">
                        <h6 class="m-0 mb-2 fw-bold text-dark fs-6">Keputusan Pembahagian:</h6>
                        <div class="d-flex justify-content-between mb-2" style="font-size:11px;">
                            <span>Jumlah Waris: <strong id="resultWaris">0</strong></span>
                            <span>Status: <strong id="status" class="text-success">Selesai</strong></span>
                        </div>

                        <div id="faraidTableContainer"></div>

                        <h6 class="mt-3 mb-1 fw-bold text-dark" style="font-size: 11px;">Pelan Pembahagian Lot (Visual):</h6>
                        <canvas id="lotCanvas" width="300" height="180"></canvas>
                    </div>
                </div>
            </nav>

            <div id="map-container">
                <button id="sidebarCollapse"><i class="fas fa-bars"></i></button>
                <div id="map"></div>
            </div>
        </div>

        <!-- JS Resources -->
        <script src="js/leaflet.js"></script>
        <script src="data/LOTFINAL_0.js"></script>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

        <script>
            // --- INSIALISASI PETA LEAFLET ---
            var map = L.map('map', { 
                zoomControl: true, 
                attributionControl: false, 
                preferCanvas: true 
            }).setView([2.10385, 102.5214], 19);
            
            var googleSatellite = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 22 }).addTo(map);
            var googleStreets = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 22 });

            var highlightLayer;
            var batuSempadanGroup = L.layerGroup().addTo(map);
            var labelGroup = L.layerGroup().addTo(map); 
            
            // --- FUNGSI MENGEMASKINI PAPARAN DAN INPUT FARAID ---
            function updateDisplay(props) {
                const lot = props['NO LOT'] || "-";
                const owner = props['tsp — pe'] || props['Pemilik'] || "Jabatan Geomatik (PUO)";
                const rawArea = props['AREA'] ? parseFloat(props['AREA']) : null;
                const areaFormatted = rawArea ? rawArea.toFixed(3) + " m²" : "-";

                document.getElementById('res-no-lot').innerText = lot;
                document.getElementById('res-owner').innerText = owner;
                document.getElementById('res-luas').innerText = areaFormatted;

                // Memasukkan nilai keluasan secara automatik ke input Kalkulator Faraid
                if (rawArea) {
                    document.getElementById('luasTanah').value = rawArea.toFixed(2);
                }
            }

            // --- POPULASIKAN LAYER GEOJSON LOT ---
            var lotLayer = L.geoJson(json_LOTFINAL_0, {
                style: { color: '#ffffff', weight: 1.5, fillColor: '#16a34a', fillOpacity: 0.35 },
                onEachFeature: function(feature, layer) {
                    
                    if (feature.properties['NO LOT']) {
                        $('#lotSearchSelector').append(`<option value="${feature.properties['NO LOT']}">Lot ${feature.properties['NO LOT']}</option>`);
                        
                        var center;
                        if (layer.getBounds) { center = layer.getBounds().getCenter(); }

                        if (center) {
                            var lotNo = feature.properties['NO LOT'];
                            var areaVal = feature.properties['AREA'] ? parseFloat(feature.properties['AREA']).toFixed(2) : "0.00";
                            var labelIcon = L.divIcon({
                                className: 'polygon-label',
                                html: `LOT ${lotNo}<br><span style="font-size:10px;">${areaVal} m²</span>`,
                                iconSize: [100, 40], iconAnchor: [50, 20]
                            });
                            L.marker(center, { icon: labelIcon, interactive: false }).addTo(labelGroup);
                        }
                    }

                    var lotContent = `<b>LOT: ${feature.properties['NO LOT']}</b><br>Luas: ${parseFloat(feature.properties['AREA']).toFixed(2)} m²`;
                    layer.bindTooltip(lotContent, { sticky: true, className: 'leaflet-tooltip-own' });

                    // Tetapan Klik Lot
                    layer.on('click', function(e) {
                        if (highlightLayer) { lotLayer.resetStyle(highlightLayer); }
                        highlightLayer = e.target;
                        highlightLayer.setStyle({ weight: 4, color: '#f59e0b', fillOpacity: 0.5 });
                        map.flyToBounds(e.target.getBounds(), { padding: [50, 50] });
                        
                        // Kemaskini data dan fokus kepada Faraid
                        updateDisplay(e.target.feature.properties);
                    });
                }
            }).addTo(map);

            // Layer Control
            var baseMaps = { "Google Satellite": googleSatellite, "Google Streets": googleStreets };
            var overlays = { "Garisan Sempadan": lotLayer, "Label Nombor Lot": labelGroup };
            L.control.layers(baseMaps, overlays, { position: 'topright' }).addTo(map);

            // Carian Lot Handler
            $('#lotSearchSelector').change(function() {
                var val = $(this).val();
                lotLayer.eachLayer(layer => {
                    if (layer.feature.properties['NO LOT'] == val) {
                        if (highlightLayer) { lotLayer.resetStyle(highlightLayer); }
                        highlightLayer = layer;
                        highlightLayer.setStyle({ weight: 4, color: '#f59e0b', fillOpacity: 0.5 });
                        map.flyToBounds(layer.getBounds(), { padding: [50, 50] });
                        updateDisplay(layer.feature.properties);
                    }
                });
            });

            // Toggle Sidebar
            $('#sidebarCollapse').click(function() { 
                $('#sidebar').toggleClass('active'); 
                setTimeout(() => { map.invalidateSize(); }, 350);
            });

            // --- LOGIK PENGIRAAN FARAID ---
            function kiraFaraid() {
                let luas = parseFloat(document.getElementById("luasTanah").value);
                let adaIsteri = document.querySelector('input[name="isteri"]:checked').value === "ya";
                let anakLelaki = parseInt(document.getElementById("anakLelaki").value) || 0;
                let anakPerempuan = parseInt(document.getElementById("anakPerempuan").value) || 0;

                if (isNaN(luas) || luas <= 0) {
                    alert("Sila pilih satu lot tanah daripada peta terlebih dahulu.");
                    return;
                }

                if (!adaIsteri && anakLelaki === 0 && anakPerempuan === 0) {
                    alert("Sila masukkan sekurang-kurangnya seorang waris.");
                    return;
                }

                let senaraiWaris = [];
                let bahagianIsteri = 0;
                let baki = 1.0;

                // 1. Pengiraan Bahagian Isteri (Fardhu)
                if (adaIsteri) {
                    let adaAnak = (anakLelaki + anakPerempuan) > 0;
                    bahagianIsteri = adaAnak ? (1 / 8) : (1 / 4);
                    baki -= bahagianIsteri;

                    senaraiWaris.push({
                        nama: "Isteri",
                        nisbahText: adaAnak ? "1/8" : "1/4",
                        peratus: bahagianIsteri,
                        luas: luas * bahagianIsteri
                    });
                }

                // 2. Pengiraan Bahagian Anak-Anak (Asabah - Nisbah 2 Lelaki : 1 Perempuan)
                let jumlahAnak = anakLelaki + anakPerempuan;

                if (jumlahAnak > 0) {
                    let jumlahUnit = (anakLelaki * 2) + (anakPerempuan * 1);
                    let nilaiSatuUnit = baki / jumlahUnit;

                    for (let i = 1; i <= anakLelaki; i++) {
                        let p = nilaiSatuUnit * 2;
                        senaraiWaris.push({
                            nama: "Anak Lelaki " + i,
                            nisbahText: "2 Bahagian",
                            peratus: p,
                            luas: luas * p
                        });
                    }

                    for (let j = 1; j <= anakPerempuan; j++) {
                        let p = nilaiSatuUnit * 1;
                        senaraiWaris.push({
                            nama: "Anak Perempuan " + j,
                            nisbahText: "1 Bahagian",
                            peratus: p,
                            luas: luas * p
                        });
                    }
                }

                // Kemaskini Ringkasan Status
                document.getElementById("resultWaris").innerText = senaraiWaris.length;

                // Bina Jadual Output
                let htmlJadual = `<table class="faraid-table">
                    <thead>
                        <tr>
                            <th>Waris</th>
                            <th>Kadar / Peratus</th>
                            <th>Luas Diperolehi (m²)</th>
                        </tr>
                    </thead>
                    <tbody>`;

                senaraiWaris.forEach(w => {
                    htmlJadual += `<tr>
                        <td><strong>${w.nama}</strong></td>
                        <td>${(w.peratus * 100).toFixed(2)}%</td>
                        <td><strong>${w.luas.toFixed(2)} m²</strong></td>
                    </tr>`;
                });

                htmlJadual += `</tbody></table>`;
                document.getElementById("faraidTableContainer").innerHTML = htmlJadual;

                // Lukis Visual Pelan Lot
                lukisPelanLot(senaraiWaris);

                document.getElementById("resultFaraid").style.display = "block";
            }

            // --- LOGIK MELUKIS PELAN LOT (CANVAS) ---
            function lukisPelanLot(senaraiWaris) {
                let canvas = document.getElementById("lotCanvas");
                let ctx = canvas.getContext("2d");

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                let currentX = 0;
                let colors = ["#16a34a", "#2563eb", "#d97706", "#db2777", "#9333ea", "#0d9488", "#dc2626"];

                senaraiWaris.forEach((w, index) => {
                    let lebar = canvas.width * w.peratus;
                    let color = colors[index % colors.length];

                    // Lukis Petak Waris
                    ctx.fillStyle = color;
                    ctx.fillRect(currentX, 0, lebar, canvas.height);

                    // Sempadan Petak
                    ctx.strokeStyle = "#ffffff";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(currentX, 0, lebar, canvas.height);

                    // Label Nama & Luas
                    if (lebar > 25) {
                        ctx.fillStyle = "#ffffff";
                        ctx.font = "bold 10px Poppins, sans-serif";
                        ctx.textAlign = "center";
                        ctx.save();
                        ctx.translate(currentX + lebar / 2, canvas.height / 2);
                        ctx.rotate(-Math.PI / 2);
                        ctx.fillText(w.nama, 0, -3);
                        ctx.font = "9px Poppins, sans-serif";
                        ctx.fillText(w.luas.toFixed(1) + "m²", 0, 10);
                        ctx.restore();
                    }

                    currentX += lebar;
                });
            }
        </script>
    </body>
</html>
